# CloudVirt 管理台：静态前端 + /api 反向代理到 Django
# 部署：复制到 /etc/nginx/sites-available/cloudvirt 并软链到 sites-enabled

upstream cloudvirt_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 前端构建产物目录（npm run build 的 dist）
    root /var/www/cloudvirt;
    index index.html;

    # 安全响应头（HTTPS 场景请再补 HSTS）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 前端静态资源：带哈希的文件长缓存，入口文件不缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API，保持同源以复用 Session + CSRF
    location /api/ {
        proxy_pass http://cloudvirt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 上传/导入镜像时的请求体上限（后续上传通道使用）
        client_max_body_size 0;
    }

    # Django 静态资源（admin 等），当前 API 不依赖，保留占位
    location /static/ {
        alias /var/www/cloudvirt-static/;
        access_log off;
        expires 7d;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/cloudvirt.access.log;
    error_log /var/log/nginx/cloudvirt.error.log;
}
