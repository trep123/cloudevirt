# Render __CONSOLE_GATEWAY_KEY__ with manage.py console_gateway_key; chmod 0640.
location = /api/v1/console/authorize { return 404; }
location = /vnc { return 410; }
location = /_cloudvirt_console_auth {
    internal;
    proxy_pass http://127.0.0.1:8000/api/v1/console/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Console-Gateway-Key __CONSOLE_GATEWAY_KEY__;
    access_log off;
}
location ^~ /console-ws/ {
    auth_request /_cloudvirt_console_auth;
    auth_request_set $console_target $upstream_http_x_console_target;
    auth_request_set $console_ticket $upstream_http_x_console_ticket;
    auth_request_set $console_node_host $upstream_http_x_console_node_host;
    proxy_pass $console_target;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Console-Ticket $console_ticket;
    proxy_ssl_server_name on;
    proxy_ssl_name $console_node_host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    # Idle displays may send no pixels; the Agent enforces the 90-second lease.
    proxy_read_timeout 3600s;
    proxy_send_timeout 100s;
    proxy_buffering off;
    access_log off;
}
